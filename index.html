<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
  <link rel="stylesheet" href="style.css">
  <script src="./index.js" type="module" defer></script>

</head>
<body>

<div class="cycler-component" id="verb-conjugator">
    <div class="conjugator-container">
    <div class="cycler-wrappers">
    <div id="voice-modality" class="cycler">
        <div class="cycle active" data-value="standard">Standard</div>
        <div class="cycle" data-value="potential">Potential</div>
    </div>

    <div id="form" class="cycler">
        <div class="cycle active" data-value="polite">Polite</div>
        <div class="cycle" data-value="short">Short</div>
        <div class="cycle" data-value="te-form">Te-Form</div>
    </div>

    <div id="tense" class="cycler">
        <div class="cycle active" data-value="present">Present</div>
        <div class="cycle" data-value="past">Past</div>
    </div>

    <div id="polarity" class="cycler">
        <div class="cycle active" data-value="affirmative">Affirmative</div>
        <div class="cycle" data-value="negative">Negative</div>
    </div>
    </div>

        <div class="conjugator-inner-wrapper">
    <div id="kana-control">
        <div class="segmented-control-kana">
            <button type="button" class="segment active" data-value="u">う</button>
            <button type="button" class="segment" data-value="ku">く</button>
            <button type="button" class="segment" data-value="gu">ぐ</button>
            <button type="button" class="segment" data-value="tsu">つ</button>
            <button type="button" class="segment" data-value="mu">む</button>
            <button type="button" class="segment" data-value="nu">ぬ</button>
            <button type="button" class="segment" data-value="bu">ぶ</button>
        </div>
    </div>

    <div class="destination">
        <div class="kana-dest"></div>
        <div class="ending-dest"></div>
    </div>
        </div>
</div>

</div>


<div id="time-section" class="selector mixed-container">

    <div class="btn-prev"> < </div>

    <div class="options-container">

    <div class="selectee active" id="temporalDeixis">
        <div class="segmented-control-tile">
            <button type="button" class="segment active" data-value="dayTemporalDeixis">Day</button>
            <button type="button" class="segment" data-value="weekTemporalDeixis">Week</button>
            <button type="button" class="segment" data-value="monthTemporalDeixis">Month</button>
            <button type="button" class="segment" data-value="yearTemporalDeixis">Year</button>
        </div>
        <div class="destination mixed-dest-container"></div>
    </div>

    <div id="time-counters" class="selectee">
        <div class="segmented-control-section">
            <button type="button" class="segment active" data-value="1">Months</button>
            <button type="button" class="segment" data-value="2">Weekdays</button>
            <button type="button" class="segment" data-value="3">Month days</button>
            <button type="button" class="segment" data-value="4">Hours</button>
            <button type="button" class="segment" data-value="5">Minutes</button>
        </div>

        <div class="destination-option mixed-dest-container" id="months" data-value="1">
            <div class="number-selector"
                 data-min="1"
                 data-max="12"
                 data-value="months">
                <button class="btn-minus">-</button>
                <label>
                    <input class="number-input" type="number" value="1">
                </label>
                <button class="btn-plus">+</button>
                <div class="destination"></div>

            </div>
        </div>

        <div class="destination-option active mixed-dest-container" id="daysOfTheWeek" data-value="2">
            <div class="number-selector"
                 data-min="1"
                 data-max="7"
                 data-value="daysOfTheWeek">
                <button class="btn-minus">-</button>
                <label>
                    <input class="number-input" type="number" value="1">
                </label>
                <button class="btn-plus">+</button>
                <div class="destination"></div>
            </div>
        </div>

        <div class="destination-option mixed-dest-container" id="daysOfTheMonth" data-value="3">
            <div class="number-selector"
                 data-min="1"
                 data-max="31"
                 data-value="daysOfTheMonth">
                <button class="btn-minus">-</button>
                <label>
                    <input class="number-input" type="number" value="1">
                </label>
                <button class="btn-plus">+</button>
                <div class="destination"></div>
            </div>
        </div>

        <div class="destination-option mixed-dest-container " id="hours" data-value="4"> Coming soon

        </div>

        <div class="destination-option mixed-dest-container " id="minutes" data-value="5"> Coming soon

        </div>

    </div></div>



    <div class="btn-next"> > </div>

</div>

<div id="grammar-section" class="selector mixed-container">
    <div class="btn-prev"> < </div>
    <div class="options-container">

    <div class="selectee active" id="generalGrammar">

    <div id="grammar-segmented-control" class="segmented-control-tile">
        <button type="button" class="segment active" data-value="particles">Particles</button>
        <button type="button" class="segment" data-value="aSoKoSeries">あそこ</button>
        <button type="button" class="segment" data-value="somethingAnything">Something / anything</button>
        <button type="button" class="segment" data-value="questionWords">Questions</button>
        <button type="button" class="segment" data-value="locationWords">Location words</button>
    </div>
    <div class="destination mixed-dest-container"></div>
    </div>
    <div class="selectee" id="clauseGrammar">
        <div class="segmented-control-tile">
            <button type="button" class="segment active" data-value="sentenceEndingDesire">Desire/Intention</button>
            <button type="button" class="segment" data-value="sentenceEndingProbability">Probability</button>
            <button type="button" class="segment" data-value="sentenceEndingState">Completion</button>
            <button type="button" class="segment" data-value="sentenceEndingPermission">Permission</button>
        </div>
        <div class="destination mixed-dest-container"></div>
    </div>

    </div>
    <div class="btn-next"> > </div>
</div>

<div class="">
    <div id="quick-access" class="">
        <div class="tab-section">
        <ul class="tabs flex-row quick-access">
            <li class="tab" data-group="verbs" data-value="functionVerbs">Function Verbs</li>
            <li class="tab" data-group="adjectives" data-value="functionAdjectives">Function Adjectives</li>
            <li class="tab" data-group="nouns" data-value="food">Food</li>
            <li class="tab" data-group="nouns" data-value="drinks">Drinks</li>
            <li class="tab" data-group="nouns" data-value="people">People</li>
            <li class="tab" data-group="nouns" data-value="commonPlaces">Generic Places</li>
            <li class="tab" data-group="nouns" data-value="popularPlaces">Popular Places</li>
            <li class="tab" data-group="nouns" data-value="commonObjects">Everyday objects</li>
            <li class="tab" data-group="nouns" data-value="media">Media</li>
            <li class="tab" data-group="nouns" data-value="technology">Technology</li>
        </ul>


            <div class="container">
                <div class="destination" data-group="verbs"></div>
                <div class="destination" data-group="nouns"></div>
                <div class="destination" data-group="adjectives"></div>
        </div>
        </div>
    </div>
</div>


<dialog id="tile-modal">
    <div class="modal-content">
    <div class="modal-title">JPN</div>
            <div class="modal-reading">reading</div>
            <div class="modal-meaning">meaning</div>
        <div class="modal-note">NOTE</div>
        <div class="modal-info">INFO</div>

    </div>

</dialog>




</body>
</html>
